name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # تنظيف تلقائي: حذف الملفات المكررة خارج المجلدات وإصلاح ملف البناء الرئيسي
      - name: Clean repo
        if: github.ref == 'refs/heads/main'
        run: |
          git rm -q --ignore-unmatch -- 01-radio.jpg 02-night-blue.jpg 03-night-yellow.jpg 04-stations.jpg 05-mushaf-index.jpg 06-mushaf-page.jpg 07-mushaf-listen.jpg 08-mushaf-night.jpg 09-search.jpg 10-prayer.jpg 11-qibla.jpg 12-azkar.jpg 13-themes.jpg MainActivity.kt AudioLevels.kt PlaybackService.kt Station.kt AndroidManifest.xml colors.xml strings.xml themes.xml file_paths.xml ic_bg.xml ic_fg.xml ic_launcher.xml "ic_launcher (1).xml" radio.html radios.json download
          printf 'plugins {\n    id("com.android.application") version "8.5.2" apply false\n    id("org.jetbrains.kotlin.android") version "1.9.24" apply false\n}\n' > build.gradle.kts
          git add build.gradle.kts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "تنظيف الملفات المكررة وإصلاح ملف البناء"
            git push && echo "تم التنظيف"
          else echo "المستودع نظيف"; fi
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.7' }
      - name: Prepare project & signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          BEST=""; BESTV=-1
          for f in $(find . -name 'settings.gradle.kts' -not -path './.git/*'); do
            D=$(dirname "$f"); V=$(grep -oE 'versionCode = [0-9]+' "$D/app/build.gradle.kts" 2>/dev/null | grep -oE '[0-9]+' || echo 0)
            echo "Found project: $D (versionCode $V)"
            if [ "$V" -gt "$BESTV" ]; then BEST="$D"; BESTV="$V"; fi
          done
          VN=$(grep -oE 'versionName = "[^"]+"' "$BEST/app/build.gradle.kts" | cut -d'"' -f2)
          echo "Using project: $BEST  version $VN ($BESTV)"
          echo "PROJ=$BEST" >> $GITHUB_ENV
          echo "VC=$BESTV" >> $GITHUB_ENV
          echo "VN=$VN" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > "$BEST/local.properties"
          # إصلاح تلقائي: ملف البناء الرئيسي يجب أن يكون هكذا دائماً (حتى لو استُبدل بالخطأ)
          printf 'plugins {\n    id("com.android.application") version "8.5.2" apply false\n    id("org.jetbrains.kotlin.android") version "1.9.24" apply false\n}\n' > "$BEST/build.gradle.kts"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "Release key: OK"
          else
            echo "::warning::KEYSTORE_BASE64 secret is missing - building with a temporary debug key"
          fi
      - name: Stamp UI version
        run: sed -i 's/content="UIVER"/content="${{ github.run_number }}"/' "$PROJ/app/src/main/assets/radio.html"
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: cd "$PROJ" && gradle assembleRelease --no-daemon --stacktrace
      - name: Collect files
        run: |
          mkdir -p out
          cp "$PROJ"/app/build/outputs/apk/release/*.apk "out/almuslim-radio-$VN.apk"
          cp "$PROJ/app/src/main/assets/radios.json" out/radios.json
          cp "$PROJ/app/src/main/assets/radio.html" out/radio.html
      - uses: actions/upload-artifact@v4
        with:
          name: QuranRadio-apk
          path: out/*.apk
      # نشر إصدار عام: التطبيق عند الناس يتحقق منه ويعرض «تحديث متوفر»، ويحدّث قائمة الإذاعات تلقائياً
      - name: Publish release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_FILE != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VC }}
          name: مذياع أنا المسلم ${{ env.VN }}
          body: إصدار جديد من مذياع أنا المسلم فيه تحسينات وإذاعات جديدة.
          files: |
            out/almuslim-radio-${{ env.VN }}.apk
            out/radios.json
            out/radio.html
          make_latest: true
